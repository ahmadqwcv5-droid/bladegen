[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bladegen"
version = "0.2.0"
description = "Neutral BladeSpec to validated OpenVSP/OCP blade-solid pipeline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "numpy>=2",
  "scipy>=1.18",
  "cadquery-ocp>=7.9,<8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
bladegen = "bladegen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bladegen*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires the headless OpenVSP runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
